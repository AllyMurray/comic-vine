packages:
  - '.'

# Match the library's 24-hour delay, including transitive dependencies.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Match the library's exception for packages maintained by the repository owner.
  - '@http-client-toolkit/*'
  # Renovate security update: sharp@0.35.5
  - sharp@0.35.5

allowBuilds:
  esbuild: true
  sharp: true

# Expressive Code's postcss-nested 6 still requests the vulnerable parser 6.x.
# Keep the override scoped to that consumer until it accepts a patched version.
overrides:
  postcss-nested@6>postcss-selector-parser: ^7.1.6
