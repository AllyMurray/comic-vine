packages:
  - '.'

# Match the library's 24-hour delay, including transitive dependencies.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Match the library's exception for packages maintained by the repository owner.
  - '@http-client-toolkit/*'

allowBuilds:
  esbuild: true
  sharp: true
