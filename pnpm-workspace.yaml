packages:
  - '.'

# Minutes since publication; applies to direct and transitive dependency resolution.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Maintained by the repository owner; third-party dependencies still wait.
  - '@http-client-toolkit/*'

allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  yaml@<2.8.3: ^2.8.3
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Save exact versions when adding dependencies.
saveExact: true
