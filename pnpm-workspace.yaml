# Keep the library and docs-site as separate pnpm projects with separate lockfiles.
packages:
  - '.'

# Minutes since publication; applies to direct and transitive dependency resolution.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  yaml@<2.8.3: ^2.8.3
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# Save exact versions when adding dependencies.
saveExact: true
