name: Deploy Docs

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to audit, build and deploy after a successful release job
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/dependency-security.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  build:
    needs: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Set up pinned Bun
        run: npm install --global "bun@$(cat "$GITHUB_WORKSPACE/.bun-version")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs-site/dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
