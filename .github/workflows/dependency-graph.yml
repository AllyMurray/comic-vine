name: dependency graph

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: sdk
            directory: .
          - project: docs
            directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Read the locked graph without installing dependencies or executing hooks.
      - name: Generate dependency inventory
        env:
          PROJECT_DIRECTORY: ${{ matrix.directory }}
        run: |
          bun scripts/dependency-inventory.mjs "$PROJECT_DIRECTORY" "$RUNNER_TEMP/dependencies.spdx.json"
          jq -e --arg name "$(jq -r .name "$PROJECT_DIRECTORY/package.json")" '
            any(.packages[]; .SPDXID == "SPDXRef-RootPackage" and .name == $name) and
            any(.relationships[]; .spdxElementId == "SPDXRef-RootPackage" and .relationshipType == "DEPENDS_ON")
          ' "$RUNNER_TEMP/dependencies.spdx.json"

      - name: Save dependency inventory
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependencies-${{ matrix.project }}
          path: ${{ runner.temp }}/dependencies.spdx.json
          if-no-files-found: error
          retention-days: 7

  submit:
    # Only trusted main-branch runs receive permission to update the graph.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: sdk
            manifest: bun.lock
          - project: docs
            manifest: docs-site/bun.lock
    steps:
      - name: Download dependency inventory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dependencies-${{ matrix.project }}
          path: ${{ runner.temp }}/dependency-inventory

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: ${{ runner.temp }}/dependency-inventory
          filePattern: dependencies.spdx.json
          manifestPath: ${{ matrix.manifest }}
          correlator: dependency-graph-${{ matrix.project }}
