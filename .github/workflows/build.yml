name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency audit policy
        if: matrix.node-version == '24.x'
        run: node --test build-tests/audit-dependencies.test.mjs

      - name: Test runtime dependency releases
        if: matrix.node-version == '24.x'
        run: node --test build-tests/runtime-release.test.mjs

      - name: Check dependency audit regressions
        if: matrix.node-version == '24.x' && github.event_name == 'pull_request'
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/audit-dependencies.mjs . "$AUDIT_BASE_SHA"

      - name: Verify dependency release-age policy
        if: matrix.node-version == '24.x'
        run: bun run test:dependency-policy

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test SDK with Bun
        if: matrix.node-version == '24.x'
        run: bun run test

      # Build tools run on Node 24; validate the output on every supported major.
      - name: Setup test runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test Build Artifacts
        run: bun run test:build:artifacts

      - name: Test installed package tarball
        run: bun run test:package

      - name: Verify generated code is up to date
        if: matrix.node-version == '24.x'
        run: |
          bun run sdk:generate
          bun run format
          git diff --exit-code -- src/ samples/code-comments/ || {
            echo "::error::Generated code is out of date. Run 'bun run sdk:generate && bun run format' and commit the result."
            exit 1
          }

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency audit regressions
        if: github.event_name == 'pull_request'
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node ../scripts/audit-dependencies.mjs docs-site "$AUDIT_BASE_SHA"

      - name: Build docs
        run: bun run build
